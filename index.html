<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bfoundr — Coming Soon</title>
<meta name="description" content="bfoundr — Building Brands. Our website is coming soon.">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#000;
    --fg:#fff;
    --muted:#9a9a9a;
    --line:#242424;
    --orange:#f26a1b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;width:100%;max-width:100%;overflow-x:clip}
  body{
    background:radial-gradient(ellipse 60% 40% at 50% 35%,rgba(242,106,27,.18),transparent 70%),var(--bg);color:var(--fg);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;min-height:100vh;
    position:relative;overflow-x:hidden;
  }
  main{
    flex:1;width:100%;min-width:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:48px 16px 24px;position:relative;
  }
  .logo{
    width:min(380px,80vw);height:auto;
    /* turns black logo white, white bg black, keeps orange */
    filter:invert(1) hue-rotate(180deg);
    animation:rise .9s ease both;
  }
  .tag{
    margin-top:-24px;
    font-size:clamp(13px,2vw,16px);letter-spacing:.5em;text-transform:uppercase;
    color:var(--orange);font-weight:600;padding-left:.5em;
    animation:rise .9s .15s ease both;
  }
  h1{
    margin-top:28px;font-weight:300;
    font-size:clamp(34px,7vw,72px);line-height:1.05;letter-spacing:-.02em;
    animation:rise .9s .3s ease both;
  }
  h1 b{font-weight:700;color:var(--orange)}
  p.lead{
    margin-top:18px;max-width:min(460px,100%);color:var(--muted);line-height:1.6;font-size:16px;
    animation:rise .9s .45s ease both;
  }
  .contact{
    margin-top:44px;display:flex;flex-direction:column;align-items:center;gap:16px;
    animation:rise .9s .55s ease both;
  }
  .contact .mail{
    color:var(--fg);text-decoration:none;font-size:clamp(22px,4vw,34px);font-weight:300;
    padding-bottom:6px;border-bottom:2px solid var(--orange);transition:color .2s;
  }
  .contact .mail:hover{color:var(--orange)}
  .contact .meta{font-size:14px;color:var(--muted);letter-spacing:.04em}
  .contact .meta a{color:inherit;text-decoration:none}
  .contact .meta a:hover{color:var(--orange)}
  .contact .meta i{color:var(--orange);font-style:normal;margin:0 10px}
  .copy{position:absolute;left:0;right:0;bottom:12px;z-index:2;text-align:center;color:#555;font-size:12px;padding:0 16px}
  .wordmark{
    position:absolute;left:0;bottom:0;width:100%;overflow:hidden;text-align:center;pointer-events:none;
    font-weight:700;letter-spacing:-.04em;line-height:.8;white-space:nowrap;
    font-size:min(20vw,380px);padding-top:.05em;user-select:none;
    background:linear-gradient(to bottom,rgba(255,255,255,.16),rgba(255,255,255,0) 85%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    height:.72em;max-width:100vw;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @media (max-width:600px){
    .contact .meta{display:flex;flex-direction:column;gap:6px}
    .contact .meta i{display:none}
    p.lead{font-size:15px;padding:0 4px}
    .tag{letter-spacing:.35em}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="bfoundr">
  <h1>Something <b>bold</b><br>is coming soon.</h1>
  <p class="lead">We're crafting our new website. Get in touch in the meantime — we'd love to hear about your brand.</p>
  <div class="contact">
    <a class="mail" href="mailto:hello@bfoundr.com">hello@bfoundr.com</a>
    <div class="meta"><a href="tel:+94704551111">+94 70 455 1111</a><i>•</i>Colombo, Sri Lanka</div>
  </div>
</main>
<div class="copy">© 2026 bfoundr. All rights reserved.</div>
<div class="wordmark" aria-hidden="true">bfoundr</div>
</body>
</html>
